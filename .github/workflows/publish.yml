# Publishes n8n-nodes-sofya to npm, with a provenance statement, when a
# version tag (v0.1.0, v0.2.0, ...) is pushed. n8n requires community nodes to
# be published from GitHub Actions with npm provenance (since May 1 2026).
#
# npm authentication, either of:
#
#   A. Trusted publishing (OIDC, preferred). On npmjs.com open the package,
#      Settings -> Trusted Publisher -> GitHub Actions, and enter
#        Organization or user: sofya-co
#        Repository:           n8n-nodes-sofya
#        Workflow filename:    publish.yml
#        Environment:          (blank)
#      and leave the NPM_TOKEN secret unset. npm can only do this for a
#      package that already exists, so the first version goes out with B.
#
#   B. Token. A granular access token with read and write publish access,
#      saved as the NPM_TOKEN repository secret (Settings -> Secrets and
#      variables -> Actions). Delete the secret once A is set up.
#
# Either way the package gets provenance: it is signed with this workflow's
# GitHub OIDC token (the id-token: write permission below).
#
# To release: bump "version" in package.json, add a CHANGELOG entry, commit,
# then `git tag v<version> && git push origin v<version>`.

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      # Mints the OIDC token used for the provenance statement (and for
      # trusted publishing, when it is set up).
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches package.json
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $expected"
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Publish
        # In GitHub Actions `n8n-node release` runs lint and build, then
        # `npm publish` with provenance enabled (NPM_CONFIG_PROVENANCE=true).
        run: |
          # With no NPM_TOKEN, npm authenticates through trusted publishing.
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
